name: 每日更新 ETF 資料

on:
  schedule:
    # 台灣時間週一到週五 14:47（收盤後），GitHub 排程用 UTC
    - cron: "47 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-etf
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 測試
        run: python -m unittest discover -s tests -v

      - name: 抓取資料
        run: python scripts/fetch_etf.py

      - name: 提交資料
        run: |
          git config user.name "breezeflow-bot"
          git config user.email "breezeflow-bot@users.noreply.github.com"
          git add data/etf.db web/data/latest.json
          git diff --cached --quiet || git commit -m "資料更新 $(date -u +%Y-%m-%d)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
