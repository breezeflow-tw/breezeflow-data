name: 每日更新 ETF 資料

on:
  push:
    branches: [main]
    paths:
      - 'web/index.html'
      - 'scripts/**'
      - 'tests/**'
      - 'data/etf_meta.csv'
      - 'data/product_overrides.json'
      - '.github/workflows/daily.yml'
  schedule:
    # GitHub 排程用 UTC（台灣時間減 8 小時），週一到週五
    - cron: "50 0 * * 1-5"   # 台灣 08:50：補上前一交易日的正式淨值
    - cron: "0 10 * * 1-5"   # 台灣 18:00：當天收盤價、預估淨值與折溢價
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-etf
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 測試
        run: |
          python -m unittest discover -s tests -v
          if compgen -G 'tests/*.mjs' > /dev/null; then
            node --test tests/*.mjs
          fi

      - name: 抓取資料
        run: python scripts/fetch_etf.py

      - name: 提交資料
        run: |
          git config user.name "breezeflow-bot"
          git config user.email "breezeflow-bot@users.noreply.github.com"
          python scripts/release.py publish

      - name: 重建下載資料庫並記錄發布版本
        run: python scripts/release.py manifest

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
